[project]
name = "euler-known-datasets"
version = "0.1.0"
description = "Turn downloaded dataset archives into euler-ready datasets: indexed for ds-crawler, loadable by euler-loading"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [
  { name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" },
]
keywords = ["dataset", "preparation", "nuscenes", "autonomous-driving", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "ds-crawler>=2.17.0",
  "euler-dataset-contract>=0.14.0",
  "numpy",
]

[project.optional-dependencies]
# orjson parses the multi-gigabyte nuScenes tables several times faster.
fast = ["orjson"]
# Hypersim keeps its images and camera trajectories in HDF5 files.
hypersim = ["h5py"]
# euler-loading (no torch needed) lets the tests load prepared outputs the way
# users will.
dev = ["pytest", "ruff", "euler-loading>=2.40.0", "Pillow", "h5py"]

[project.scripts]
euler-known-datasets = "euler_known_datasets.cli:main"

[project.urls]
Homepage = "https://github.com/d-rothen/euler-known-datasets"
Issues = "https://github.com/d-rothen/euler-known-datasets/issues"
Repository = "https://github.com/d-rothen/euler-known-datasets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["euler_known_datasets"]

[tool.hatch.build.targets.sdist]
only-include = [
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "SECURITY.md",
  "docs",
  "euler_known_datasets",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: tests that need the real downloaded dataset (deselected by default)"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
